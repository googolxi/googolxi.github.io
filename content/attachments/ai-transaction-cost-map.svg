<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">AI 降低交易成本，让新增交易发生</title>
  <desc id="desc">展示潜在需求和潜在供给如何因为搜索、理解、决策、服务、履约和风险成本过高而无法成交，AI 降低摩擦后形成新增交易。</desc>
  <defs>
    <style>
      .bg { fill: #fbf7ef; }
      .grid { stroke: #d8ccb9; stroke-width: 1; opacity: .42; }
      .paper { fill: #fffefa; stroke: #c8bda8; stroke-width: 2; }
      .dark { fill: #17211f; }
      .green { fill: #21483b; }
      .blue { fill: #243e63; }
      .copper { fill: #a8663c; }
      .muted { fill: #6e746a; }
      .line { stroke: #21483b; stroke-width: 4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; letter-spacing: 0; }
      .serif { font-family: Georgia, "Times New Roman", "Songti SC", "STSong", serif; }
    </style>
  </defs>
  <rect class="bg" width="1400" height="820" rx="34"/>
  <g>
    <path class="grid" d="M82 90H1318M82 230H1318M82 370H1318M82 510H1318M82 650H1318"/>
    <path class="grid" d="M130 70V755M330 70V755M530 70V755M730 70V755M930 70V755M1130 70V755"/>
  </g>

  <text x="88" y="105" class="dark serif" font-size="44" font-weight="600">交易不是因为有需求就会发生</text>
  <text x="90" y="146" class="muted" font-size="22">只有当交易价值大于一连串成本，需求和供给才会真正连上。</text>

  <g transform="translate(92 220)">
    <rect class="paper" x="0" y="0" width="342" height="390" rx="16"/>
    <text x="36" y="58" class="blue" font-size="30" font-weight="850">潜在需求</text>
    <text x="36" y="104" class="dark" font-size="22">用户想要解决问题</text>
    <text x="36" y="144" class="muted" font-size="18">但不知道怎么选</text>
    <text x="36" y="176" class="muted" font-size="18">不信任服务方</text>
    <text x="36" y="208" class="muted" font-size="18">流程复杂，中途放弃</text>
    <circle cx="78" cy="292" r="34" fill="#e5ebf2" stroke="#243e63" stroke-width="2"/>
    <circle cx="166" cy="292" r="34" fill="#e5ebf2" stroke="#243e63" stroke-width="2"/>
    <circle cx="254" cy="292" r="34" fill="#e5ebf2" stroke="#243e63" stroke-width="2"/>
  </g>

  <g transform="translate(966 220)">
    <rect class="paper" x="0" y="0" width="342" height="390" rx="16"/>
    <text x="36" y="58" class="copper" font-size="30" font-weight="850">潜在供给</text>
    <text x="36" y="104" class="dark" font-size="22">商家能提供价值</text>
    <text x="36" y="144" class="muted" font-size="18">但服务成本过高</text>
    <text x="36" y="176" class="muted" font-size="18">不了解规则和运营</text>
    <text x="36" y="208" class="muted" font-size="18">风险和售后压低利润</text>
    <rect x="52" y="258" width="55" height="70" rx="8" fill="#f1e4d8" stroke="#a8663c" stroke-width="2"/>
    <rect x="142" y="238" width="55" height="90" rx="8" fill="#f1e4d8" stroke="#a8663c" stroke-width="2"/>
    <rect x="232" y="274" width="55" height="54" rx="8" fill="#f1e4d8" stroke="#a8663c" stroke-width="2"/>
  </g>

  <g transform="translate(504 202)">
    <rect x="0" y="0" width="392" height="428" rx="22" fill="#17211f"/>
    <text x="196" y="62" fill="#fffefa" text-anchor="middle" font-size="30" font-weight="850">AI 压低交易摩擦</text>
    <text x="196" y="108" fill="#d8ccb9" text-anchor="middle" font-size="18">不是只帮员工提效，而是让交易成立</text>
    <g font-size="20" font-weight="700">
      <text x="58" y="168" fill="#fffefa">搜索成本</text>
      <text x="224" y="168" fill="#fffefa">理解成本</text>
      <text x="58" y="218" fill="#fffefa">决策成本</text>
      <text x="224" y="218" fill="#fffefa">服务成本</text>
      <text x="58" y="268" fill="#fffefa">履约成本</text>
      <text x="224" y="268" fill="#fffefa">风险成本</text>
    </g>
    <path d="M72 342H320" stroke="#f1e4d8" stroke-width="3" stroke-linecap="round"/>
    <text x="196" y="384" fill="#f1e4d8" text-anchor="middle" font-size="24" font-weight="850">交易价值 &gt; 交易成本</text>
  </g>

  <path class="line" d="M438 410C482 410 488 410 502 410"/>
  <path class="line" d="M896 410C910 410 916 410 962 410"/>
  <path class="line" d="M486 392l22 18-22 18"/>
  <path class="line" d="M946 392l22 18-22 18"/>

  <g transform="translate(230 690)">
    <rect class="paper" x="0" y="0" width="940" height="72" rx="14"/>
    <text x="470" y="45" class="green" text-anchor="middle" font-size="24" font-weight="850">当某项成本被压到临界点以下，原来不经济的交易开始变得经济。</text>
  </g>
</svg>
