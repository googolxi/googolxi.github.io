<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">从旧流程到新闭环</title>
  <desc id="desc">展示 AI 时代工作方式从线性长流程变为市场信号、AI 原型、小范围验证和快速迭代的新闭环。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2l8 4-8 4z" fill="#183d65"/>
    </marker>
    <style>
      .bg { fill: #fbf7ef; }
      .panel { fill: #fffdf8; stroke: #c4ae93; stroke-width: 2; }
      .old { fill: #f2e1d8; stroke: #a55d42; stroke-width: 2; }
      .new { fill: #e7efe3; stroke: #526f5b; stroke-width: 2; }
      .blue { fill: #183d65; }
      .ink { fill: #20211d; }
      .muted { fill: #746d61; }
      .clay { fill: #a55d42; }
      .green { fill: #526f5b; }
      .line { fill: none; stroke: #183d65; stroke-width: 4; marker-end: url(#arrow); }
      .loop { fill: none; stroke: #526f5b; stroke-width: 5; marker-end: url(#arrow); }
      .title { font: 700 44px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .h2 { font: 700 30px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .label { font: 700 24px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .small { font: 500 18px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    </style>
  </defs>
  <rect class="bg" width="1400" height="760" rx="32"/>
  <text x="90" y="88" class="title ink">从“线性执行”到“验证闭环”</text>
  <text x="92" y="128" class="small muted">AI 压低实现成本后，工作重点从排期和交付，迁移到机会判断与市场反馈。</text>

  <g transform="translate(80 175)">
    <rect width="1240" height="210" rx="24" class="panel"/>
    <text x="34" y="54" class="h2 clay">旧流程：慢、重、反馈滞后</text>
    <g transform="translate(48 92)">
      <rect width="170" height="78" rx="14" class="old"/>
      <text x="85" y="48" text-anchor="middle" class="label ink">需求</text>
      <path class="line" d="M190 39h70"/>
      <rect x="280" width="170" height="78" rx="14" class="old"/>
      <text x="365" y="48" text-anchor="middle" class="label ink">排期</text>
      <path class="line" d="M470 39h70"/>
      <rect x="560" width="170" height="78" rx="14" class="old"/>
      <text x="645" y="48" text-anchor="middle" class="label ink">实现</text>
      <path class="line" d="M750 39h70"/>
      <rect x="840" width="170" height="78" rx="14" class="old"/>
      <text x="925" y="48" text-anchor="middle" class="label ink">上线</text>
      <path class="line" d="M1030 39h70"/>
      <rect x="1120" width="170" height="78" rx="14" class="old"/>
      <text x="1205" y="48" text-anchor="middle" class="label ink">等待反馈</text>
    </g>
  </g>

  <g transform="translate(80 430)">
    <rect width="1240" height="250" rx="24" class="panel"/>
    <text x="34" y="54" class="h2 green">新闭环：小步验证，持续校正</text>
    <g transform="translate(130 84)">
      <circle cx="130" cy="80" r="72" class="new"/>
      <text x="130" y="74" text-anchor="middle" class="label ink">市场信号</text>
      <text x="130" y="104" text-anchor="middle" class="small muted">真实问题</text>
      <path class="loop" d="M212 80C285 35 345 35 418 80"/>
      <circle cx="520" cy="80" r="72" class="new"/>
      <text x="520" y="74" text-anchor="middle" class="label ink">AI 原型</text>
      <text x="520" y="104" text-anchor="middle" class="small muted">低成本实现</text>
      <path class="loop" d="M602 80C675 35 735 35 808 80"/>
      <circle cx="910" cy="80" r="72" class="new"/>
      <text x="910" y="74" text-anchor="middle" class="label ink">小范围验证</text>
      <text x="910" y="104" text-anchor="middle" class="small muted">拿反馈</text>
      <path class="loop" d="M910 160C790 235 320 235 130 160"/>
    </g>
    <text x="640" y="222" text-anchor="middle" class="small blue">每一轮都在回答：值得做吗？商业成立吗？能拿到分发吗？</text>
  </g>
</svg>
